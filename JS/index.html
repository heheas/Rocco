<head>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="input.js"></script>
  <script src="Game.js"></script>
  <script src="GameObjects.js"></script>
</head>
<body>
   <canvas id="myCanvas" width="900" height="600" style="border:1px solid #000000;display:inline-block;">
</canvas>
  <br/>
  Home: <select id="selAssignHome" type="text">
    <option value="1"></option>
    <option value="2"></option>
    <option value="3"></option>
    <option value="4"></option>
    <option value="5"></option>
    <option value="6"></option>
  </select>
  <input id="btnAssignHome" type="button" value="Assign Home" onclick="assignHome()"/>
<br/>
Tiles: 
<input type="button" disabled value="Pull New Tile" onclick="pullNewTile()"/>
<input type="button" id="btnMove" value="Move" onclick="moveTile()"/>
<input type="button" value="<-" onclick="rotateSelectedTile(false)"/>
<input type="button" value="->" onclick="rotateSelectedTile(true)"/>
<input type="button" value="flip" onclick="flipSelectedTile(true)"/>
<input type="button" value="remove" onclick="removeSelectedTile()"/>
<br/>
</body>
