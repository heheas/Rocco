<head>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="InitialValues.js"></script>
  <script src="input.js"></script>
  <script src="GameObjects.js"></script>
  <script src="Player.js"></script>
  <script src="Game.js"></script>
</head>
<body>
   <canvas id="myCanvas" width="900" height="600" style="border:1px solid #000000;display:inline-block;">
</canvas>
  <br/>
  XY: <div id="xy"></div>
  Player Setup: 
  Name:
  <input id="txtPlayerName" type="text"></input>
  Robot: 
  <select id="selRobot">
    <option value="ROBOT1" selected="selected">Robot 1</option>
    <option value="ROBOT2">Robot 2</option>
    <option value="ROBOT3">Robot 3</option>
    <option value="ROBOT4">Robot 4</option>
    <option value="ROBOT5">Robot 5</option>
    <option value="ROBOT6">Robot 6</option>
  </select>
  Home Location: 
  <select id="selAssignHome">
    <option value="1" selected="selected">1</option>
    <option value="2">2</option>
    <option value="3">3</option>
    <option value="4">4</option>
    <option value="5">5</option>
    <option value="6">6</option>
  </select>
  <input id="btnAddPlayer" type="button" value="Add Player" onclick="addPlayer()"/>
<br/>
Tiles: 
<input type="button" disabled value="Pull New Tile" onclick="pullNewTile()"/>
<input type="button" id="btnMove" value="Move" onclick="moveTile()"/>
<input type="button" value="<-" onclick="rotateSelectedTile(false)"/>
<input type="button" value="->" onclick="rotateSelectedTile(true)"/>
<input type="button" value="flip" onclick="flipSelectedTile(true)"/>
<input type="button" value="remove" onclick="removeSelectedTile()"/>
<br/>
</body>
